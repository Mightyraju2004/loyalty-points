<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Registration — CafeRewards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="/index.html" class="logo">☕ CafeRewards</a>
    <nav>
      <a href="/index.html">Home Page</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>

  <div class="auth-card">
    <h2>Register Staff Account</h2>
    <div id="authError" class="alert alert-error" style="display: none;"></div>
    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="staff@cafe.com">
      </div>
      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit">Create Account</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.85rem; text-align: center;">
      Already have an account? <a href="/login.html">Login here</a>
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
