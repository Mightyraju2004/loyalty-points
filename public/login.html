<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Login — CafeRewards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="/index.html" class="logo">☕ CafeRewards</a>
    <nav>
      <a href="/index.html">Home Page</a>
      <a href="/register.html">Register Staff</a>
    </nav>
  </header>

  <div class="auth-card">
    <h2>Staff Login</h2>
    <div id="authError" class="alert alert-error" style="display: none;"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="staff@cafe.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit">Sign In to POS Counter</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.85rem; text-align: center;">
      Need a staff account? <a href="/register.html">Register here</a>
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
