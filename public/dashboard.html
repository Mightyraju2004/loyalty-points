<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POS Counter — CafeRewards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="/index.html" class="logo">☕ CafeRewards POS Counter</a>
    <nav>
      <a href="/index.html">Landing Page</a>
      <a href="#" onclick="logout()" style="color: #dc2626;">Logout</a>
    </nav>
  </header>

  <div class="container">
    <div class="grid">
      <!-- 1. REGISTER MEMBER -->
      <div class="card">
        <h3>1. Register New Member</h3>
        <form id="addMemberForm" onsubmit="registerMember(event)">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="mName" required placeholder="e.g. Rahul Sharma">
          </div>
          <div class="form-group">
            <label>Phone Number (Unique Lookup Key)</label>
            <input type="text" id="mPhone" required placeholder="e.g. 9876543210">
          </div>
          <div class="form-group">
            <label>Email (Optional)</label>
            <input type="email" id="mEmail" placeholder="rahul@example.com">
          </div>
          <button type="submit">Add Member to Loyalty System</button>
        </form>
      </div>

      <!-- 2. LOOKUP & TRANSACTIONS -->
      <div class="card">
        <h3>2. Phone Lookup & Transactions</h3>
        <div class="form-group">
          <label>Search Member by Phone</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="lookupPhone" placeholder="Enter phone number...">
            <button type="button" onclick="lookupMember()" style="width: auto;">Lookup</button>
          </div>
        </div>

        <!-- ACTIVE MEMBER DETAILS CARD -->
        <div id="activeMemberCard" style="display: none; background: #f1f5f9; padding: 1rem; border-radius: 6px; margin-bottom: 1rem;">
          <p><strong>Customer:</strong> <span id="activeName"></span> (<span id="activePhone"></span>)</p>
          <p><strong>Live Balance:</strong> <span id="activeBalance"></span></p>
          <p><strong>Loyalty Tier:</strong> <span id="activeTier" class="badge"></span></p>
        </div>

        <hr style="margin: 1rem 0; border: none; border-top: 1px solid var(--border-color);">

        <!-- EARN POINTS -->
        <div class="form-group">
          <label>Record Purchase Bill Amount (₹)</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="number" id="purchaseAmount" placeholder="e.g. 350">
            <button type="button" onclick="processEarn()" style="width: auto; background: #16a34a;">Add Points</button>
          </div>
        </div>

        <!-- REDEEM POINTS -->
        <div class="form-group">
          <label>Redeem Free Item</label>
          <select id="rewardSelect">
            <option value="1">Free Coffee (100 pts)</option>
            <option value="2">Free Sandwich (250 pts)</option>
            <option value="3">Free Cake (400 pts)</option>
          </select>
          <button type="button" onclick="processRedeem()" class="danger">Redeem Reward</button>
        </div>
      </div>
    </div>

    <!-- 3. MEMBER DIRECTORY TABLE -->
    <div class="card">
      <h3>Member Directory & Live Balances</h3>
      <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <input type="text" id="searchInput" placeholder="Search by name or phone number..." oninput="loadMembers(1)">
        <select id="sortSelect" onchange="loadMembers(1)" style="max-width: 200px;">
          <option value="created_at">Sort by Date</option>
          <option value="name">Sort by Name</option>
          <option value="phone">Sort by Phone</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Current Balance</th>
            <th>Tier</th>
            <th>Earn Multiplier</th>
          </tr>
        </thead>
        <tbody id="memberTableBody"></tbody>
      </table>

      <div class="pagination">
        <button type="button" onclick="if(currentPage > 1) loadMembers(currentPage - 1)" class="secondary" style="width: auto;">&larr; Previous</button>
        <span id="pageInfo">Page 1</span>
        <button type="button" onclick="loadMembers(currentPage + 1)" class="secondary" style="width: auto;">Next &rarr;</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    checkAuth();
    loadMembers(1);
  </script>
</body>
</html>
